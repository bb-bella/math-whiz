name: Deploy to Vercel (Auto Bootstrap)

on:
  push:
    branches:
    - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    ######################################################################
    # 1. AUTO-BOOTSTRAP THE PROJECT FOR VERCEL
    ######################################################################

    - name: Ensure API directory exists
      run: mkdir -p api

    - name: Remove incompatible backend servers
      run: |
        rm -f server.js || true
        rm -f app.js || true
        rm -f index.js || true

    - name: Remove Express/Koa remnants
      run: |
        grep -rl "express" . | xargs rm -f || true
        grep -rl "koa" . | xargs rm -f || true

    - name: Generate Vercel Serverless Gemini API Route
      run: |
        mkdir -p api
        cat > api/gemini.js << 'EOFAPI'
        import { GoogleGenerativeAI } from "@google/generative-ai";

        export default async function handler(req, res) {
          try {
            if (req.method !== "POST") {
              return res.status(405).json({ error: "Method Not Allowed" });
            }

            const { question } = req.body;

            if (!question) {
              return res.status(400).json({ error: "Missing question" });
            }

            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ model: "gemini-pro" });

            const result = await model.generateContent(question);
            const text = result.response.text();

            return res.status(200).json({ response: text });
          } catch (err) {
            console.error("API ERROR:", err);
            return res.status(500).json({ error: "Internal Server Error" });
          }
        }
        EOFAPI

    - name: Patch Frontend Gemini Service
      run: |
        mkdir -p services
        cat > services/geminiService.js << 'EOFSERVICE'
        export async function askGemini(question) {
          const res = await fetch("/api/gemini", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question })
          });

          if (!res.ok) {
            throw new Error("Gemini API Error");
          }

          const data = await res.json();
          return data.response;
        }
        EOFSERVICE

    - name: Generate vercel.json
      run: |
        cat > vercel.json << 'EOFVERCEL'
        {
          "version": 2,
          "routes": [
            { "src": "/api/(.*)", "dest": "/api/$1.js" }
          ]
        }
        EOFVERCEL

    ######################################################################
    # 2. INSTALL DEPENDENCIES (IGNORE STRICT PEER DEPENDENCIES)
    ######################################################################

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    ######################################################################
    # 3. BUILD THE PROJECT
    ######################################################################

    - name: Build project
      run: npm run build

    ######################################################################
    # 4. DEPLOY TO VERCEL
    ######################################################################

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Deploy to Vercel
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: vercel deploy --prod --token "$VERCEL_TOKEN" --yes
